<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5G Speed Switcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #121315;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Адаптація під формат 9:16 */
    .screen-container {
      width: 100%;
      height: 100%;
      max-width: 450px;
      background: #1c1e22;
      border: 2px solid #33373e;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 24px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    /* --- АНТЕНА (ВЕЛИКА) --- */
    .antenna-container {
      height: 280px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      margin-top: 20px;
    }

    .antenna-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: bottom center;
    }

    /* Опускання антени */
    .antenna-wrapper.lowered {
      transform: translateY(70px) scaleY(0.7);
    }

    /* Елементи антени */
    .signal-wave {
      width: 120px;
      height: 40px;
      border: 8px solid #444850;
      border-bottom: none;
      border-radius: 80px 80px 0 0;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .antenna-top {
      width: 32px;
      height: 32px;
      background-color: #444850;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .antenna-pole {
      width: 14px;
      height: 120px;
      background-color: #444850;
      border-radius: 7px;
      transition: all 0.3s ease;
    }

    .antenna-base {
      width: 110px;
      height: 18px;
      background-color: #2a2d34;
      border-radius: 9px;
    }

    /* Ефект неонового підсвічування при активації */
    .connected .signal-wave {
      border-color: #00d2ff;
      box-shadow: 0 -10px 30px rgba(0, 210, 255, 0.8);
    }

    .connected .antenna-top {
      background-color: #00d2ff;
      box-shadow: 0 0 35px #00d2ff, 0 0 60px #00d2ff;
    }

    .connected .antenna-pole {
      background-color: #00d2ff;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.9);
    }

    /* СТАТУС */
    .status-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #555a64;
      text-transform: uppercase;
      margin-top: 15px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .status-text.active {
      color: #00d2ff;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
    }

    /* --- КНОПКИ МЕРЕЖІ --- */
    .network-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-network {
      flex: 1;
      padding: 18px 0;
      background: #26292e;
      border: 2px solid #3d414a;
      border-radius: 16px;
      color: #7b808a;
      font-weight: 900;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Активна кнопка 5G */
    .btn-network.active {
      background: #0052cc;
      border-color: #00d2ff;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
    }

    /* --- СЛАЙДЕР ШВИДКОСТІ --- */
    .slider-section {
      width: 100%;
      background: #23262c;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #353942;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .slider-title {
      font-size: 20px;
      font-weight: 800;
      color: #a0a5b0;
    }

    .speed-value {
      font-size: 36px;
      font-weight: 900;
      color: #ffffff;
    }

    .speed-value span {
      font-size: 20px;
      color: #00d2ff;
      margin-left: 4px;
    }

    .range-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 16px;
      border-radius: 8px;
      background: #121315;
      outline: none;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #00d2ff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 210, 255, 1);
    }

    .range-slider::-moz-range-thumb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #00d2ff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 210, 255, 1);
      border: none;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #616672;
    }
  </style>
</head>
<body>

  <div class="screen-container">
    
    <!-- Антена -->
    <div class="antenna-container">
      <div class="antenna-wrapper" id="antennaWrapper">
        <div class="signal-wave"></div>
        <div class="antenna-top"></div>
        <div class="antenna-pole"></div>
      </div>
      <div class="antenna-base"></div>
      <div class="status-text" id="statusText">DISCONNECTED</div>
    </div>

    <!-- Кнопки вибору мережі -->
    <div class="network-buttons">
      <button class="btn-network" onclick="selectNetwork(this)">2G</button>
      <button class="btn-network" onclick="selectNetwork(this)">3G</button>
      <button class="btn-network" onclick="selectNetwork(this)">4G</button>
      <button class="btn-network active" id="btn5G" onclick="selectNetwork(this)">5G</button>
    </div>

    <!-- Слайдер швидкості -->
    <div class="slider-section">
      <div class="slider-header">
        <span class="slider-title">SPEED</span>
        <div class="speed-value"><span id="speedDisplay">0</span> <span>Mbps</span></div>
      </div>
      <input 
        type="range" 
        min="0" 
        max="5000" 
        value="0" 
        step="10" 
        class="range-slider" 
        id="speedSlider"
      >
      <div class="slider-labels">
        <span>0</span>
        <span>1K</span>
        <span>5K</span>
      </div>
    </div>

  </div>

  <script>
    const slider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const antennaWrapper = document.getElementById('antennaWrapper');
    const statusText = document.getElementById('statusText');

    // Спрацьовує миттєво при перетягуванні слайдера
    slider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      speedDisplay.textContent = val;
      
      // Активація анімації підключення при 1000 або 5000 Mbps
      if (val >= 5000) {
        activateConnectedState('5K MAX SPEED');
      } else if (val >= 1000 && val < 1050) {
        activateConnectedState('1K SPEED');
      } else {
        resetAntenna();
      }
    });

    function activateConnectedState(text) {
      antennaWrapper.classList.add('lowered', 'connected');
      statusText.classList.add('active');
      statusText.textContent = `CONNECTED (${text})`;
    }

    function resetAntenna() {
      antennaWrapper.classList.remove('lowered', 'connected');
      statusText.classList.remove('active');
      statusText.textContent = 'DISCONNECTED';
    }

    function selectNetwork(element) {
      document.querySelectorAll('.btn-network').forEach(btn => {
        btn.classList.remove('active');
      });
      element.classList.add('active');
    }
  </script>
</body>
</html>

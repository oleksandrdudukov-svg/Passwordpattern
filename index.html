<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Password Setup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #05040a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .phone-container {
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 820px;
      background: radial-gradient(circle at center, #150a21 0%, #05040a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 20px 60px;
      position: relative;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f0e6ff;
      text-shadow: 0 0 12px rgba(187, 134, 252, 0.4);
    }

    .header p {
      font-size: 14px;
      color: #9d8ec2;
      margin-top: 8px;
    }

    .canvas-wrapper {
      position: relative;
      width: 320px;
      height: 380px;
      border: 1px solid rgba(187, 134, 252, 0.15);
      border-radius: 24px;
      background: rgba(18, 10, 31, 0.4);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 0 0 25px rgba(138, 43, 226, 0.1);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .btn {
      background: rgba(187, 134, 252, 0.1);
      border: 1px solid rgba(187, 134, 252, 0.4);
      color: #e2c8ff;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.2);
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
      background: rgba(187, 134, 252, 0.25);
      box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
    }

    /* Toast notification */
    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(22, 12, 38, 0.95);
      border: 1.5px solid #c872ff;
      padding: 22px 32px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 35px rgba(200, 114, 255, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .toast-icon {
      font-size: 36px;
      margin-bottom: 8px;
      display: block;
    }

    .toast-title {
      font-size: 18px;
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 0 10px #c872ff;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="header">
      <h1 id="status-title">Set up your password</h1>
      <p id="status-sub">Draw any shape, heart, or gesture</p>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gestureCanvas"></canvas>
    </div>

    <div class="controls">
      <button class="btn" id="resetBtn">Create New Pattern</button>
    </div>

    <div class="toast" id="toast">
      <span class="toast-icon">💜</span>
      <div class="toast-title">New password created!</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gestureCanvas');
    const ctx = canvas.getContext('2d');
    const resetBtn = document.getElementById('resetBtn');
    const toast = document.getElementById('toast');
    const statusTitle = document.getElementById('status-title');
    const statusSub = document.getElementById('status-sub');

    let isDrawing = false;
    let hasDrawn = false;
    let isLocked = false;
    let points = [];

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      redraw();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      if (isLocked) return;
      isDrawing = true;
      hasDrawn = true;
      points = [];
      const pos = getPos(e);
      points.push([pos]);
      redraw();
    }

    function moveDrawing(e) {
      if (!isDrawing || isLocked) return;
      const pos = getPos(e);
      const currentStroke = points[points.length - 1];
      currentStroke.push(pos);
      redraw();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      if (hasDrawn && !isLocked) {
        isLocked = true;
        showSuccess();
      }
    }

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (points.length === 0) return;

      ctx.save();
      ctx.strokeStyle = '#d980ff';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = '#b300ff';
      ctx.shadowBlur = 20;

      for (let stroke of points) {
        if (stroke.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }
        ctx.stroke();
      }

      ctx.restore();
    }

    function showSuccess() {
      toast.classList.add('show');
      statusTitle.textContent = "New password created!";
      statusSub.textContent = "Your custom gesture password is active";

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    function reset() {
      isDrawing = false;
      hasDrawn = false;
      isLocked = false;
      points = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      toast.classList.remove('show');
      statusTitle.textContent = "Set up your password";
      statusSub.textContent = "Draw any shape, heart, or gesture";
    }

    // Mouse events
    canvas.addEventListener('mousedown', startDrawing);
    window.addEventListener('mousemove', moveDrawing);
    window.addEventListener('mouseup', stopDrawing);

    // Touch events (finger)
    canvas.addEventListener('touchstart', startDrawing);
    window.addEventListener('touchmove', moveDrawing);
    window.addEventListener('touchend', stopDrawing);

    resetBtn.addEventListener('click', reset);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>

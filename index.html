<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Password Setup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      /* Прибираємо синє підсвічування при тапі на мобільних */
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    body {
      background-color: #030206;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .phone-container {
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      aspect-ratio: 9 / 16;
      background: radial-gradient(circle at center, #150a24 0%, #030206 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 24px 80px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    .header {
      text-align: center;
      margin-top: 10px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f0e6ff;
      text-shadow: 0 0 12px rgba(187, 134, 252, 0.4);
    }

    .header p {
      font-size: 14px;
      color: #9d8ec2;
      margin-top: 8px;
    }

    .canvas-wrapper {
      position: relative;
      width: 320px;
      height: 380px;
      border: 1px solid rgba(187, 134, 252, 0.18);
      border-radius: 28px;
      background: rgba(18, 10, 31, 0.45);
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7), 0 0 30px rgba(138, 43, 226, 0.12);
      overflow: hidden;
      margin-bottom: 20px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
    }

    .btn {
      width: 85%;
      padding: 16px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      outline: none !important;
      text-align: center;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-appearance: none;
    }

    .btn:focus, .btn:active {
      outline: none !important;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent !important;
    }

    .btn-save {
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      border: none;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
    }

    .btn-save:active {
      transform: scale(0.96);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.7);
    }

    .btn-reset {
      background: rgba(187, 134, 252, 0.08);
      border: 1px solid rgba(187, 134, 252, 0.3);
      color: #e2c8ff;
      font-size: 14px;
      padding: 12px 20px;
    }

    .btn-reset:active {
      transform: scale(0.96);
      background: rgba(187, 134, 252, 0.2);
    }

    /* Fullscreen Overlay Screen */
    .fullscreen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 4, 15, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    .fullscreen-overlay.show {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .icon-box {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(126, 34, 206, 0.05) 100%);
      border: 2px solid #a855f7;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      margin-bottom: 24px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.5);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 45px rgba(168, 85, 247, 0.7); transform: scale(1.05); }
      100% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); transform: scale(1); }
    }

    .fullscreen-overlay h2 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
      margin-bottom: 10px;
    }

    .fullscreen-overlay p {
      font-size: 15px;
      color: #a799c7;
      margin-bottom: 35px;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="header">
      <h1 id="status-title">Set up your password</h1>
      <p id="status-sub">Draw any shape, heart, or gesture</p>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gestureCanvas"></canvas>
    </div>

    <div class="controls">
      <button class="btn btn-save" id="saveBtn">Save New Password</button>
      <button class="btn btn-reset" id="resetBtn">Create New Pattern</button>
    </div>

    <!-- Fullscreen Success Modal -->
    <div class="fullscreen-overlay" id="fullOverlay">
      <div class="icon-box">💜</div>
      <h2>New password created!</h2>
      <p>Your custom gesture password has been set successfully.</p>
      <button class="btn btn-save" id="overlayCloseBtn" style="width: 70%;">Done</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gestureCanvas');
    const ctx = canvas.getContext('2d');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const fullOverlay = document.getElementById('fullOverlay');
    const overlayCloseBtn = document.getElementById('overlayCloseBtn');
    const statusTitle = document.getElementById('status-title');
    const statusSub = document.getElementById('status-sub');

    let isDrawing = false;
    let hasDrawn = false;
    let isLocked = false;
    let points = [];

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      redraw();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      if (isLocked) return;
      isDrawing = true;
      hasDrawn = true;
      const pos = getPos(e);
      points.push([pos]);
      redraw();
    }

    function moveDrawing(e) {
      if (!isDrawing || isLocked) return;
      const pos = getPos(e);
      const currentStroke = points[points.length - 1];
      currentStroke.push(pos);
      redraw();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
    }

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (points.length === 0) return;

      ctx.save();
      ctx.strokeStyle = '#d980ff';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = '#b300ff';
      ctx.shadowBlur = 22;

      for (let stroke of points) {
        if (stroke.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }
        ctx.stroke();
      }

      ctx.restore();
    }

    function savePassword() {
      if (!hasDrawn || points.length === 0) return;
      isLocked = true;
      fullOverlay.classList.add('show');
    }

    function reset() {
      isDrawing = false;
      hasDrawn = false;
      isLocked = false;
      points = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fullOverlay.classList.remove('show');
      statusTitle.textContent = "Set up your password";
      statusSub.textContent = "Draw any shape, heart, or gesture";
    }

    // Mouse events
    canvas.addEventListener('mousedown', startDrawing);
    window.addEventListener('mousemove', moveDrawing);
    window.addEventListener('mouseup', stopDrawing);

    // Touch events (finger)
    canvas.addEventListener('touchstart', startDrawing);
    window.addEventListener('touchmove', moveDrawing);
    window.addEventListener('touchend', stopDrawing);

    saveBtn.addEventListener('click', savePassword);
    resetBtn.addEventListener('click', reset);
    overlayCloseBtn.addEventListener('click', reset);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
